<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How the replication study is organized</title><desc id="d">Three phases on a single Apple M4 Mac: Phase 1 audits tests, CSVs and metric implementations; Phase 2 extracts and scores 6 open text models against DINOv2-B on WIT-1024; Phase 3 tests good views against bad views in finite worlds and small LeJEPA runs.</desc><rect width="760" height="320" fill="#fcfcfb"/><text x="24.0" y="28.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Figure 1. How the replication is organized</text><text x="24.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Frozen analysis plan before the first scored run; all compute on one Apple M4 Mac (16 GB memory).</text><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8984"/></marker></defs><rect x="24.0" y="68.0" width="224.0" height="152.0" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="24.0" y="68.0" width="6.0" height="152.0" rx="0" fill="#2a78d6"/><text x="40.0" y="90.0" font-size="12.2" fill="#0b0b0b" text-anchor="start" font-weight="600">Phase 1: Released repo and metrics</text><text x="40.0" y="112.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Pinned galilai-group/prh-proof commit</text><text x="40.0" y="132.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">135 of 139 upstream tests pass on CPU</text><text x="40.0" y="152.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Rebuild headline numbers from CSVs</text><text x="40.0" y="172.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Cross-check NumPy metrics vs PyTorch</text><text x="40.0" y="192.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Test 0.95-clip under orthogonal rotation</text><rect x="268.0" y="68.0" width="224.0" height="152.0" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><rect x="268.0" y="68.0" width="6.0" height="152.0" rx="0" fill="#eb6834"/><text x="284.0" y="90.0" font-size="12.2" fill="#0b0b0b" text-anchor="start" font-weight="600">Phase 2: WIT-1024 baselines</text><text x="284.0" y="112.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">1,024 Wikipedia image-caption pairs</text><text x="284.0" y="132.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Frozen DINOv2-B (12 blocks, 518 px)</text><text x="284.0" y="152.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">6 open text models up to Qwen2.5-3B</text><text x="284.0" y="172.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Mutual 10-NN and unbiased linear CKA</text><text x="284.0" y="192.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Sensitivity: unclipped and final-layer</text><rect x="512.0" y="68.0" width="224.0" height="152.0" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><rect x="512.0" y="68.0" width="6.0" height="152.0" rx="0" fill="#1baf7a"/><text x="528.0" y="90.0" font-size="12.2" fill="#0b0b0b" text-anchor="start" font-weight="600">Phase 3: Good views vs bad views</text><text x="528.0" y="112.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Exact spectral check on 20 finite worlds</text><text x="528.0" y="132.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Sample-density sweep (1 to 64 per state)</text><text x="528.0" y="152.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">3-seed BERT-T LeJEPA on COCO captions</text><text x="528.0" y="172.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">51,200 scenes per run, same seed &amp; lr</text><text x="528.0" y="192.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Scored on WIT-1024 (mKNN and CKA)</text><line x1="248.0" y1="144.0" x2="268.0" y2="144.0" stroke="#8a8984" stroke-width="1.6" marker-end="url(#arr)"/><line x1="492.0" y1="144.0" x2="512.0" y2="144.0" stroke="#8a8984" stroke-width="1.6" marker-end="url(#arr)"/><rect x="24.0" y="240.0" width="712.0" height="58.0" rx="6" fill="#f1f0ec" stroke="#e6e5e0" stroke-width="1"/><text x="38.0" y="262.0" font-size="11.8" fill="#0b0b0b" text-anchor="start" font-weight="600">Audit trail: results/phase1.json, results/phase2_wit1024.json, results/phase3_views.json -&gt; paper/numbers.json</text><text x="38.0" y="282.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Every number in the report and figures is rebuilt by scripts/report_numbers.py; claims are indexed in paper/claims.md.</text></svg>
