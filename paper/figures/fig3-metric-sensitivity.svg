<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sensitivity of WIT-1024 alignment to 0.95-quantile coordinate clipping and layer selection</title><desc id="d">Grouped bars comparing standard PRH mutual 10-NN (best layer with 0.95-quantile clipping), final-layer mutual 10-NN, and unclipped best-layer mutual 10-NN across 6 open text encoders.</desc><rect width="760" height="376" fill="#fcfcfb"/><text x="24.0" y="28.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Figure 3. Coordinate clipping and layer choice strongly move LLM scores on WIT-1024</text><text x="24.0" y="46.0" font-size="11.8" fill="#52514e" text-anchor="start" font-weight="400">Removing the 0.95-quantile elementwise clip cuts Qwen2.5-3B by 35% (.126 to .082), while mpnet barely moves (.118 to .116).</text><rect x="24.0" y="60.0" width="13.0" height="10.0" rx="2" fill="#2a78d6"/><text x="42.0" y="69.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Standard PRH (best layer, 0.95 clip)</text><rect x="262.0" y="60.0" width="13.0" height="10.0" rx="2" fill="#1baf7a"/><text x="280.0" y="69.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Final layer only (0.95 clip)</text><rect x="500.0" y="60.0" width="13.0" height="10.0" rx="2" fill="#eb6834"/><text x="518.0" y="69.0" font-size="11.3" fill="#52514e" text-anchor="start" font-weight="400">Best layer, no coordinate clip</text><line x1="188.0" y1="88.0" x2="188.0" y2="336.0" stroke="#e6e5e0" stroke-width="1"/><text x="188.0" y="352.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">0.00</text><line x1="279.6" y1="88.0" x2="279.6" y2="336.0" stroke="#e6e5e0" stroke-width="1"/><text x="279.6" y="352.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">0.04</text><line x1="371.2" y1="