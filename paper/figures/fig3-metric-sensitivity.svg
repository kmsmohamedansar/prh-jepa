8.0" y="186.2" width="233.9" height="7.5" rx="1.5" fill="#1baf7a"/><text x="426.9" y="193.2" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.102</text><rect x="188.0" y="195.7" width="229.0" height="7.5" rx="1.5" fill="#eb6834"/><text x="422.0" y="202.7" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.100</text><text x="178.0" y="235.0" font-size="11.8" fill="#0b0b0b" text-anchor="end" font-weight="500">all-mpnet-base-v2</text><rect x="188.0" y="218.0" width="270.8" height="7.5" rx="1.5" fill="#2a78d6"/><text x="463.8" y="225.0" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.118</text><rect x="188.0" y="227.5" width="264.5" height="7.5" rx="1.5" fill="#1baf7a"/><text x="457.5" y="234.5" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.116</text><rect x="188.0" y="237.0" width="264.7" height="7.5" rx="1.5" fill="#eb6834"/><text x="457.7" y="244.0" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.116</text><text x="178.0" y="276.3" font-size="11.8" fill="#0b0b0b" text-anchor="end" font-weight="500">CLIP ViT-B/32 text</text><rect x="188.0" y="259.3" width="284.4" height="7.5" rx="1.5" fill="#2a78d6"/><text x="477.4" y="266.3" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.124</text><rect x="188.0" y="268.8" width="209.3" height="7.5" rx="1.5" fill="#1baf7a"/><text x="402.3" y="275.8" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.091</text><rect x="188.0" y="278.3" width="207.9" height="7.5" rx="1.5" fill="#eb6834"/><text x="400.9" y="285.3" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.091</text><text x="178.0" y="317.7" font-size="11.8" fill="#0b0b0b" text-anchor="end" font-weight="500">Qwen2.5-3B (bf16)</text><rect x="188.0" y="300.7" width="288.9" height="7.5" rx="1.5" fill="#2a78d6"/><text x="481.9" y="307.7" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.126</text><rect x="188.0" y="310.2" width="243.3" height="7.5" rx="1.5" fill="#1baf7a"/><text x="436.3" y="317.2" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.106</text><rect x="188.0" y="319.7" width="187.8" height="7.5" rx="1.5" fill="#eb6834"/><text x="380.8" y="326.7" font-size="9.8" fill="#52514e" text-anchor="start" font-weight="400">0.082</text><rect x="556.0" y="94.0" width="184.0" height="232.0" rx="6" fill="#ffffff" stroke="#e6e5e0" stroke-width="1"/><text x="568.0" y="116.0" font-size="12.2" fill="#0b0b0b" text-anchor="start" font-weight="600">Two sides of prh_prep</text><text x="568.0" y="136.0" font-size="10.6" fill="#0b0b0b" text-anchor="start" font-weight="600">1. Helps causal LLMs:</text><text x="568.0" y="149.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   Autoregressive hidden</text><text x="568.0" y="163.0" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   states develop extreme</text><text x="568.0" y="176.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   outlier coordinates.</text><text x="568.0" y="190.0" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   Clipping at the 0.95</text><text x="568.0" y="203.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   quantile restores cosine</text><text x="568.0" y="217.0" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   neighbours (+.044 on 3B).</text><text x="568.0" y="230.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="568.0" y="244.0" font-size="10.6" fill="#0b0b0b" text-anchor="start" font-weight="600">2. Breaks rotation symmetry:</text><text x="568.0" y="257.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   On N=1024, d=64 Gaussian</text><text x="568.0" y="271.0" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   features and an exact</text><text x="568.0" y="284.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   orthogonal rotation Q,</text><text x="568.0" y="298.0" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   raw mKNN is 1.000, but</text><text x="568.0" y="311.5" font-size="10.6" fill="#52514e" text-anchor="start" font-weight="400">   clipped PRH drops to 0.775.</text></svg>
